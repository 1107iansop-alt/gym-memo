<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GYM-MEMO</title>
  <style>
    :root {
      --bg-dark: #121214;
      --card-bg: #1c1c1e;
      --accent-red: #ff453a;
      --text-main: #ffffff;
      --text-sub: #8e8e93;
      --border-color: #2c2c2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: max(24px, env(safe-area-inset-top) + 16px) 16px 90px 16px;
      max-width: 500px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0 20px 0;
    }
    h1 { font-size: 1.5rem; color: var(--accent-red); font-weight: 700; letter-spacing: 0.5px; }
    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }
    .summary-title { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .summary-value { font-size: 2.2rem; font-weight: 800; }
    .summary-unit { font-size: 1rem; color: var(--text-sub); }
    .summary-stats { display: flex; gap: 20px; margin-top: 15px; font-size: 0.85rem; color: var(--text-sub); }
    
    /* カレンダー */
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 600; font-size: 0.95rem; }
    .cal-btn { background: none; border: none; color: var(--accent-red); font-size: 1.1rem; cursor: pointer; padding: 4px 8px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 0.75rem; }
    .calendar-dow { color: var(--text-sub); padding-bottom: 4px; font-weight: 600; }
    .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--text-main); background: #2c2c2e; font-size: 0.75rem; }
    .calendar-day.active { background-color: var(--accent-red); font-weight: bold; }
    .calendar-day.empty { background: transparent; }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .btn {
      background-color: var(--accent-red);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-secondary { background-color: #2c2c2e; color: #0a84ff; }
    .history-head { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; }
    .empty-state {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      color: var(--text-sub);
      font-size: 0.9rem;
    }

    /* 履歴カード */
    .history-card { background-color: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border-color); }
    .history-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .history-date { font-weight: bold; color: var(--accent-red); font-size: 0.95rem; }
    .history-part { background: #2c2c2e; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; color: var(--text-sub); }
    .history-sets { font-size: 0.85rem; color: var(--text-sub); line-height: 1.4; }
    .delete-btn { background: none; border: none; color: #ff453a; font-size: 0.8rem; cursor: pointer; }

    /* モーダル */
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); display: none; align-items: flex-end; z-index: 100;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: var(--card-bg); width: 100%; max-height: 90vh; overflow-y: auto;
      border-radius: 20px 20px 0 0; padding: 24px 20px 40px 20px; border-top: 1px solid var(--border-color);
    }
    .modal-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px; display: block; }
    .form-input, .form-select {
      width: 100%; background: #2c2c2e; border: 1px solid var(--border-color); color: white;
      padding: 12px; border-radius: 10px; font-size: 1rem;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .submit-btn { width: 100%; background: var(--accent-red); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 1rem; margin-top: 10px; cursor: pointer; }
    .close-modal { width: 100%; background: #2c2c2e; color: var(--text-main); border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 0.95rem; margin-top: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>GYM-MEMO</h1>
    <span>⚙️</span>
  </header>

  <div class="card">
    <div class="summary-title">
      <span id="current-month-label">2026年11月 総括</span>
    </div>
    <div class="summary-value"><span id="total-weight">0.00</span> <span class="summary-unit">t</span></div>
    <div class="summary-stats">
      <span id="total-days">トレ日数: 0 日</span>
      <span id="total-sets">総セット数: 0 セット</span>
    </div>

    <!-- カレンダー -->
    <div class="calendar-container" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border-color);">
      <div class="cal-header">
        <button class="cal-btn" onclick="changeMonth(-1)">◀</button>
        <span id="cal-title">2026年 11月</span>
        <button class="cal-btn" onclick="changeMonth(1)">▶</button>
      </div>
      <div class="calendar-grid" id="calendar-grid">
        <div class="calendar-dow">日</div><div class="calendar-dow">月</div><div class="calendar-dow">火</div>
        <div class="calendar-dow">水</div><div class="calendar-dow">木</div><div class="calendar-dow">金</div>
        <div class="calendar-dow">土</div>
      </div>
    </div>
  </div>

  <div class="btn-grid">
    <button class="btn" onclick="openModal()">＋ 今日のトレーニング追加</button>
    <button class="btn btn-secondary" onclick="alert('月間サマリー画像生成機能は準備中です')">📷 月間サマリー画像</button>
  </div>

  <div class="history-head">トレーニング履歴</div>
  <div id="history-area">
    <div class="empty-state">記録はまだありません。</div>
  </div>

  <!-- 記録入力モーダル -->
  <div class="modal" id="record-modal">
    <div class="modal-content">
      <div class="modal-title">トレーニング追加</div>
      <div class="form-group">
        <label class="form-label">日付</label>
        <input type="date" id="input-date" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">部位</label>
        <select id="input-part" class="form-select">
          <option value="胸">胸</option>
          <option value="背中">背中</option>
          <option value="脚">脚</option>
          <option value="肩">肩</option>
          <option value="腕">腕</option>
          <option value="腹">腹</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">種目名</label>
        <input type="text" id="input-exercise" class="form-input" placeholder="例: ベンチプレス">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">重量 (kg)</label>
          <input type="number" step="0.5" id="input-weight" class="form-input" placeholder="80">
        </div>
        <div class="form-group">
          <label class="form-label">回数 (rep)</label>
          <input type="number" id="input-reps" class="form-input" placeholder="10">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">セット数</label>
        <input type="number" id="input-sets" class="form-input" value="3">
      </div>
      <button class="submit-btn" onclick="saveRecord()">保存する</button>
      <button class="close-modal" onclick="closeModal()">キャンセル</button>
    </div>
  </div>

  <script>
    let workouts = JSON.parse(localStorage.getItem('gym_workouts')) || [];
    let viewYear = new Date().getFullYear();
    let viewMonth = new Date().getMonth(); // 0-11

    function openModal() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('input-date').value = today;
      document.getElementById('record-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('record-modal').classList.remove('open');
    }

    function saveRecord() {
      const date = document.getElementById('input-date').value;
      const part = document.getElementById('input-part').value;
      const exercise = document.getElementById('input-exercise').value || '種目なし';
      const weight = parseFloat(document.getElementById('input-weight').value) || 0;
      const reps = parseInt(document.getElementById('input-reps').value) || 0;
      const sets = parseInt(document.getElementById('input-sets').value) || 1;

      if (!date) {
        alert('日付を入力してください');
        return;
      }

      workouts.push({ id: Date.now(), date, part, exercise, weight, reps, sets });
      localStorage.setItem('gym_workouts', JSON.stringify(workouts));
      
      closeModal();
      render();
    }

    function deleteRecord(id) {
      if (confirm('この記録を削除しますか？')) {
        workouts = workouts.filter(w => w.id !== id);
        localStorage.setItem('gym_workouts', JSON.stringify(workouts));
        render();
      }
    }

    function changeMonth(direction) {
      viewMonth += direction;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      render();
    }

    function render() {
      document.getElementById('cal-title').textContent = `${viewYear}年 ${viewMonth + 1}月`;
      document.getElementById('current-month-label').textContent = `${viewYear}年 ${viewMonth + 1}月 総括`;

      const monthWorkouts = workouts.filter(w => {
        const d = new Date(w.date);
        return d.getFullYear() === viewYear && d.getMonth() === viewMonth;
      });

      let totalTonnage = 0;
      let activeDaysSet = new Set();
      let totalSetsCount = 0;

      monthWorkouts.forEach(w => {
        totalTonnage += (w.weight * w.reps * w.sets) / 1000;
        activeDaysSet.add(w.date);
        totalSetsCount += w.sets;
      });

      document.getElementById('total-weight').textContent = totalTonnage.toFixed(2);
      document.getElementById('total-days').textContent = `トレ日数: ${activeDaysSet.size} 日`;
      document.getElementById('total-sets').textContent = `総セット数: ${totalSetsCount} セット`;

      const grid = document.getElementById('calendar-grid');
      const dows = grid.querySelectorAll('.calendar-dow');
      grid.innerHTML = '';
      dows.forEach(el => grid.appendChild(el));

      const firstDay = new Date(viewYear, viewMonth, 1).getDay();
      const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'calendar-day empty';
        grid.appendChild(emptyCell);
      }

      for (let d = 1; d <= lastDate; d++) {
        const cell = document.createElement('div');
        cell.className = 'calendar-day';
        cell.textContent = d;
        
        const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        if (activeDaysSet.has(dateStr)) {
          cell.classList.add('active');
        }
        grid.appendChild(cell);
      }

      const historyArea = document.getElementById('history-area');
      const sortedWorkouts = [...workouts].sort((a, b) => new Date(b.date) - new Date(a.date));

      if (sortedWorkouts.length === 0) {
        historyArea.innerHTML = `<div class="empty-state">記録はまだありません。</div>`;
        return;
      }

      historyArea.innerHTML = sortedWorkouts.map(w => {
        const rm = w.reps > 0 && w.weight > 0 ? Math.round(w.weight * (1 + w.reps / 30)) : 0;
        return `
          <div class="history-card">
            <div class="history-top">
              <div>
                <span class="history-date">${w.date}</span>
                <span class="history-part">${w.part}</span>
              </div>
              <button class="delete-btn" onclick="deleteRecord(${w.id})">削除</button>
            </div>
            <div style="font-weight: 600; font-size: 1rem; margin-bottom: 4px;">${w.exercise}</div>
            <div class="history-sets">
              ${w.weight}kg × ${w.reps}回 × ${w.sets}セット 
              ${rm > 0 ? `<span style="color: var(--text-main); margin-left: 8px;">(推定1RM: ${rm}kg)</span>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    render();
  </script>
</body>
</html>
