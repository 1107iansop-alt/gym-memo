<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Workout-Log</title>
  <!-- 画像ダウンロード・シェア用ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-dark: #121214;
      --card-bg: #1c1c1e;
      --accent-red: #ff453a;
      --accent-gold: #ffd700;
      --text-main: #ffffff;
      --text-sub: #8e8e93;
      --border-color: #2c2c2e;
      --accent-blue: #0a84ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: max(16px, env(safe-area-inset-top) + 8px) 12px 65px 12px;
      max-width: 500px;
      margin: 0 auto;
      overflow-x: hidden;
    }
    header { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px 12px 4px; }
    h1 { font-size: 1.3rem; color: var(--accent-red); font-weight: 700; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background-color: var(--card-bg); border-radius: 16px; padding: 14px; margin-bottom: 16px; border: 1px solid var(--border-color); width: 100%; overflow: hidden; }
    
    .home-top-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: center; }
    
    .calendar-container { display: flex; flex-direction: column; justify-content: center; width: 100%; }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
    .cal-btn { background: none; border: none; color: var(--accent-red); font-size: 1rem; cursor: pointer; padding: 2px 6px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; width: 100%; }
    .calendar-dow { color: var(--text-sub); padding-bottom: 3px; font-weight: 600; font-size: 0.65rem; }
    .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--text-main); background: #2c2c2e; font-size: 0.7rem; width: 100%; max-width: 28px; margin: 0 auto; cursor: pointer; }
    .calendar-day.active { background-color: var(--accent-red); font-weight: bold; }
    .calendar-day.selected { border: 2px solid #ffffff; }
    .calendar-day.empty { background: transparent; cursor: default; }

    .home-right-col { display: flex; flex-direction: column; gap: 8px; justify-content: space-between; height: 100%; }
    
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .stat-box { background: #121214; border: 1px solid var(--border-color); border-radius: 10px; padding: 6px 2px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
    .stat-title { font-size: 0.55rem; color: var(--text-sub); margin-bottom: 2px; white-space: nowrap; }
    .stat-val { font-size: 0.85rem; font-weight: 800; color: var(--accent-red); }

    .action-btn-list { display: flex; flex-direction: column; gap: 5px; }
    .mini-btn { background-color: var(--accent-red); color: white; border: none; border-radius: 8px; padding: 7px 6px; font-weight: bold; font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; width: 100%; }
    .mini-btn-secondary { background-color: #2c2c2e; color: var(--text-main); border: 1px solid var(--border-color); }

    .empty-state { background-color: var(--card-bg); border-radius: 12px; padding: 30px 20px; text-align: center; color: var(--text-sub); font-size: 0.9rem; margin-bottom: 16px; }

    .workout-day-view { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 20px; border: 1px solid var(--border-color); }
    .workout-day-title { font-size: 1.05rem; font-weight: bold; color: var(--accent-red); margin-bottom: 14px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
    
    .history-card { background-color: #252528; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; border: 1px solid var(--border-color); cursor: pointer; transition: background 0.2s; }
    .history-card:hover { background-color: #2f2f33; }
    
    .history-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .history-ex-title { font-weight: 700; font-size: 1rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
    
    .history-set-row { display: grid; grid-template-columns: 24px 75px 10px 65px 1fr; align-items: center; font-size: 0.8rem; color: var(--text-main); margin-top: 4px; white-space: nowrap; }
    .set-num-col { text-align: right; padding-right: 4px; color: var(--text-main); }
    .set-weight-col { text-align: right; }
    .set-x-col { text-align: center; color: var(--text-sub); }
    .set-reps-col { text-align: right; padding-right: 4px; }
    .set-rm-col { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; color: var(--text-sub); overflow: hidden; }

    /* バッジカラー：更新は赤、同率はゴールド */
    .max-rm-badge { font-size: 0.55rem; font-weight: bold; padding: 1px 4px; border-radius: 3px; flex-shrink: 0; display: inline-block; }
    .max-rm-badge.red { background-color: var(--accent-red); color: #ffffff; }
    .max-rm-badge.gold { background-color: var(--accent-gold); color: #000000; }

    /* MAX RM画面用 2段式レイアウト */
    .max-rm-container { background: var(--card-bg); border-radius: 16px; padding: 16px; border: 1px solid var(--border-color); }
    .max-rm-header { font-size: 1.1rem; font-weight: bold; color: var(--accent-red); margin-bottom: 14px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
    .max-rm-card { padding: 10px 4px; border-bottom: 1px solid var(--border-color); }
    .max-rm-card:last-child { border-bottom: none; }
    .max-rm-title { font-size: 0.95rem; font-weight: bold; color: var(--text-main); margin-bottom: 6px; word-break: break-all; }
    .max-rm-subrow { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; }
    .max-rm-date { color: var(--text-sub); }
    .max-rm-divider { color: var(--border-color); }
    .max-rm-val { font-weight: 800; color: var(--accent-red); }
    .max-rm-actual { color: var(--text-sub); font-size: 0.78rem; }

    .footer-nav {
      position: fixed; bottom: 0; left: 0; width: 100%; background: #1c1c1e; border-top: 1px solid var(--border-color);
      display: grid; grid-template-columns: repeat(3, 1fr); padding: 5px 0 0 0; height: 50px; z-index: 50;
    }
    .nav-item { background: none; border: none; color: var(--text-sub); display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; gap: 2px; cursor: pointer; padding-bottom: env(safe-area-inset-bottom, 0px); }
    .nav-item.active { color: var(--accent-red); }
    .nav-item span.icon { font-size: 1rem; }

    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: flex-end; z-index: 100; }
    .modal.open { display: flex; }
    .modal-content { background: var(--card-bg); width: 100%; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 20px 16px 40px 16px; border-top: 1px solid var(--border-color); }
    
    .last-record-box { background: #2c2c2e; border-radius: 12px; padding: 12px; margin-bottom: 20px; font-size: 0.85rem; }
    .last-record-title { color: var(--text-sub); font-weight: bold; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }

    .copy-last-btn { background: #2c2c2e; color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px; padding: 4px 10px; font-size: 0.7rem; font-weight: bold; cursor: pointer; }

    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 0.80rem; color: var(--text-sub); margin-bottom: 6px; display: block; }
    .form-input, .form-select { width: 100%; background: #2c2c2e; border: 1px solid var(--border-color); color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; padding: 12px; border-radius: 10px; font-size: 0.95rem; }

    /* セット入力行のグリッド調整 */
    .set-row { display: grid; grid-template-columns: 24px 26px 1fr 26px 1fr 52px 30px; gap: 4px; align-items: center; margin-bottom: 10px; background: #252528; padding: 8px 4px; border-radius: 10px; }
    .set-num { font-weight: bold; color: var(--accent-red); text-align: center; font-size: 0.85rem; }
    .set-input { width: 100%; background: #1c1c1e; border: 1px solid var(--border-color); color: white; padding: 8px 2px; border-radius: 8px; font-size: 0.9rem; text-align: center; }
    .set-rm { font-size: 0.65rem; color: var(--text-sub); text-align: center; white-space: nowrap; overflow: hidden; }

    .copy-prev-btn { background: #2c2c2e; border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px; height: 32px; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 100%; }
    .copy-prev-btn:active { background: #3a3a3c; }

    .delete-set-btn { background: none; border: 1px solid #ff453a; color: #ff453a; border-radius: 6px; height: 32px; font-size: 0.8rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 100%; }
    .delete-set-btn:active { background: rgba(255, 69, 58, 0.2); }

    .add-set-btn { width: 100%; background: #2c2c2e; color: #34c759; border: 1px dashed #34c759; padding: 12px; border-radius: 10px; font-weight: bold; margin-top: 10px; cursor: pointer; }
    .submit-btn { width: 100%; background: var(--accent-red); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 1rem; margin-top: 15px; cursor: pointer; }
    .close-modal { width: 100%; background: #2c2c2e; color: var(--text-main); border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 0.95rem; margin-top: 8px; cursor: pointer; }
    .manage-btn { background: #2c2c2e; color: var(--text-main); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; }

    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .summary-box { background: #121214; border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; text-align: center; }
    .summary-box-title { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 4px; }
    .summary-box-val { font-size: 1.4rem; font-weight: 800; color: var(--accent-red); }
  </style>
</head>
<body>
  <header>
    <h1>Workout-Log</h1>
  </header>

  <!-- ホームタブ -->
  <div id="tab-home" class="tab-content active">
    <div class="card">
      <div class="home-top-grid">
        <div class="calendar-container">
          <div class="cal-header">
            <button class="cal-btn" onclick="changeMonth(-1)">◀</button>
            <span id="cal-title">2026年 11月</span>
            <button class="cal-btn" onclick="changeMonth(1)">▶</button>
          </div>
          <div class="calendar-grid" id="calendar-grid">
            <div class="calendar-dow">日</div><div class="calendar-dow">月</div><div class="calendar-dow">火</div>
            <div class="calendar-dow">水</div><div class="calendar-dow">木</div><div class="calendar-dow">金</div>
            <div class="calendar-dow">土</div>
          </div>
        </div>

        <div class="home-right-col">
          <div class="stats-row">
            <div class="stat-box">
              <div class="stat-title">今月日数</div>
              <div class="stat-val" id="stat-month-days">0days</div>
            </div>
            <div class="stat-box">
              <div class="stat-title">合計日数</div>
              <div class="stat-val" id="stat-total-days">0days</div>
            </div>
          </div>

          <div class="action-btn-list">
            <button class="mini-btn" onclick="openModal()">今日のトレーニング追加</button>
            <button class="mini-btn mini-btn-secondary" onclick="shareCurrentDay()">当日サマリ</button>
            <button class="mini-btn mini-btn-secondary" onclick="openSummaryModal()">月間サマリ</button>
            <button class="mini-btn mini-btn-secondary" onclick="openManageModal()">部位/種目の管理</button>
          </div>
        </div>
      </div>
    </div>

    <div id="home-workout-display"></div>
  </div>

  <!-- 履歴タブ -->
  <div id="tab-history" class="tab-content">
    <div class="filter-tabs" id="filter-tabs-container" style="display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:16px;"></div>
    
    <div class="card">
      <div class="cal-header">
        <button class="cal-btn" onclick="changeHistoryMonth(-1)">◀</button>
        <span id="history-cal-title">2026年 11月</span>
        <button class="cal-btn" onclick="changeHistoryMonth(1)">▶</button>
      </div>
      <div class="calendar-grid" id="history-calendar-grid">
        <div class="calendar-dow">日</div><div class="calendar-dow">月</div><div class="calendar-dow">火</div>
        <div class="calendar-dow">水</div><div class="calendar-dow">木</div><div class="calendar-dow">金</div>
        <div class="calendar-dow">土</div>
      </div>
    </div>

    <div id="history-timeline-display"></div>
  </div>

  <!-- MAX RMタブ -->
  <div id="tab-maxrm" class="tab-content">
    <div class="max-rm-container">
      <div class="max-rm-header">種目別 MAX RM</div>
      <div id="max-rm-list-display"></div>
    </div>
  </div>

  <!-- フッターナビゲーション -->
  <nav class="footer-nav">
    <button class="nav-item active" onclick="switchTab('home', this)">
      <span class="icon">🏠</span>
      <span>ホーム</span>
    </button>
    <button class="nav-item" onclick="switchTab('history', this)">
      <span class="icon">📅</span>
      <span>履歴</span>
    </button>
    <button class="nav-item" onclick="switchTab('maxrm', this)">
      <span class="icon">🏋️</span>
      <span>MAX RM</span>
    </button>
  </nav>

  <!-- モーダル類 -->
  <div class="modal" id="record-modal">
    <div class="modal-content">
      <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="form-group">
          <label class="form-label">部位</label>
          <select id="input-part" class="form-select" onchange="onPartChange()"></select>
        </div>
        <div class="form-group">
          <label class="form-label">種目名</label>
          <select id="input-exercise-select" class="form-select" onchange="onExerciseChange()"></select>
        </div>
      </div>

      <div class="last-record-box" id="last-record-box">
        <div class="last-record-title">
          <span>Last Record (<span id="last-record-date" style="color: #ffffff;">----/--/--</span>)</span>
          <button class="copy-last-btn" id="copy-last-btn" onclick="copyLastRecordData()" style="display:none;">前回履歴コピー</button>
        </div>
        <div id="last-record-content" style="color: var(--text-sub);">前回の記録はありません</div>
      </div>

      <div id="strength-input-area">
        <div style="display: grid; grid-template-columns: 24px 26px 1fr 26px 1fr 52px 30px; gap: 4px; font-size: 0.65rem; color: var(--text-sub); text-align: center; margin-bottom: 6px;">
          <div>セット</div><div></div><div>重さ(kg)</div><div></div><div>回数</div><div>推定1RM</div><div></div>
        </div>
        <div id="set-inputs-container"></div>
        <button class="add-set-btn" onclick="addSetInput()">＋ セットを追加</button>
      </div>

      <div id="cardio-input-area" style="display: none;">
        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label class="form-label">運動時間 (分)</label>
            <input type="number" id="cardio-time" class="form-input" placeholder="30">
          </div>
          <div class="form-group">
            <label class="form-label">速度 (km/h)</label>
            <input type="number" step="0.1" id="cardio-speed" class="form-input" placeholder="10.0">
          </div>
        </div>
        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label class="form-label">距離 (km)</label>
            <input type="number" step="0.01" id="cardio-distance" class="form-input" placeholder="5.0">
          </div>
          <div class="form-group">
            <label class="form-label">消費カロリー (kcal)</label>
            <input type="number" id="cardio-cal" class="form-input" placeholder="300">
          </div>
        </div>
      </div>

      <div class="form-group" style="margin-top: 15px;">
        <label class="form-label">メモ (任意)</label>
        <input type="text" id="input-memo" class="form-input" placeholder="フォームや感想など">
      </div>

      <button class="submit-btn" onclick="saveRecord()">記録を保存する</button>
      <button class="close-modal" onclick="closeModal()">キャンセル</button>
    </div>
  </div>

  <div class="modal" id="summary-modal">
    <div class="modal-content">
      <div id="summary-capture-target" style="padding: 10px; background: var(--card-bg); border-radius: 16px;">
        <div style="font-size: 1.3rem; font-weight: bold; color: var(--accent-red); text-align: center; margin-bottom: 15px;" id="summary-modal-main-title">2026年 11月 サマリ</div>
        
        <div class="card" style="margin-bottom: 16px;">
          <div class="cal-header">
            <button class="cal-btn" onclick="changeSummaryMonth(-1)">◀</button>
            <span id="summary-cal-title">2026年 11月</span>
            <button class="cal-btn" onclick="changeSummaryMonth(1)">▶</button>
          </div>
          <div class="calendar-grid" id="summary-calendar-grid">
            <div class="calendar-dow">日</div><div class="calendar-dow">月</div><div class="calendar-dow">火</div>
            <div class="calendar-dow">水</div><div class="calendar-dow">木</div><div class="calendar-dow">金</div>
            <div class="calendar-dow">土</div>
          </div>
        </div>

        <div class="summary-grid">
          <div class="summary-box">
            <div class="summary-box-title">合計筋トレ日数</div>
            <div class="summary-box-val" id="sum-days">0 days</div>
          </div>
          <div class="summary-box">
            <div class="summary-box-title">合計負荷量</div>
            <div class="summary-box-val" id="sum-ton">0.00 t</div>
          </div>
          <div class="summary-box">
            <div class="summary-box-title">合計セット数</div>
            <div class="summary-box-val" id="sum-sets">0 sets</div>
          </div>
          <div class="summary-box">
            <div class="summary-box-title">合計レップ数</div>
            <div class="summary-box-val" id="sum-reps">0 reps</div>
          </div>
        </div>

        <div id="summary-parts-breakdown" style="background: #121214; border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; margin-bottom: 10px;">
          <div style="font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; color: var(--accent-red);">■ 部位別集計</div>
          <div id="summary-parts-list" style="font-size: 0.85rem; color: var(--text-sub);">集計データはありません</div>
        </div>
      </div>

      <button class="download-action-btn" onclick="shareSummaryMonthImage()" style="width:100%; background:#0a84ff; color:white; border:none; padding:14px; border-radius:12px; font-weight:bold; font-size:0.95rem; margin-top:15px; cursor:pointer;">サマリを画像保存</button>
      <button class="close-modal" onclick="closeSummaryModal()" style="margin-top:8px;">閉じる</button>
    </div>
  </div>

  <div class="modal" id="manage-modal">
    <div class="modal-content">
      <div style="font-size: 1.3rem; font-weight: bold; color: var(--accent-red); text-align: center; margin-bottom: 15px;">種目・部位の管理</div>
      <div id="manage-content-area" style="font-size: 0.9rem; color: var(--text-main); margin-bottom: 20px;"></div>
      <button class="close-modal" onclick="closeManageModal()">閉じる</button>
    </div>
  </div>

  <script>
    let customParts = JSON.parse(localStorage.getItem('gym_custom_parts')) || ['胸', '背中', '脚', '肩', '腕', '腹', '前腕', 'お尻', '有酸素運動', 'その他'];
    let customExercises = JSON.parse(localStorage.getItem('gym_custom_exercises')) || {};
    let workouts = JSON.parse(localStorage.getItem('gym_workouts_v2')) || [];

    let currentLastRecordData = null;
    
    function getTodayString() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    let selectedDate = getTodayString();
    let viewYear = new Date().getFullYear();
    let viewMonth = new Date().getMonth();
    let historyViewYear = new Date().getFullYear();
    let historyViewMonth = new Date().getMonth();
    let summaryViewYear = new Date().getFullYear();
    let summaryViewMonth = new Date().getMonth();

    let currentHistoryPart = 'ALL';

    function refreshToCurrentDate() {
      const realToday = getTodayString();
      const now = new Date();
      if (selectedDate !== realToday) {
        selectedDate = realToday;
      }
      viewYear = now.getFullYear();
      viewMonth = now.getMonth();
      renderHome();
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) refreshToCurrentDate();
    });
    window.addEventListener('pageshow', refreshToCurrentDate);

    function getAllParts() {
      return [...new Set(customParts)];
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

      document.getElementById(`tab-${tabId}`).classList.add('active');
      el.classList.add('active');

      if (tabId === 'history') {
        renderHistoryFilterTabs();
        renderHistoryCalendar();
      } else if (tabId === 'maxrm') {
        renderMaxRMTab();
      }
    }

    // 1RM計算 (O'Conner公式)
    function calcRM(w, r) {
      if (!w || !r || w <= 0 || r <= 0) return 0;
      return w * (1 + r / 30);
    }

    function renderMaxRMTab() {
      const displayArea = document.getElementById('max-rm-list-display');
      const strengthWorkouts = workouts.filter(w => !w.isCardio && w.sets && w.sets.length > 0);

      if (strengthWorkouts.length === 0) {
        displayArea.innerHTML = `<div class="empty-state">トレーニング記録がありません。</div>`;
        return;
      }

      const maxMap = {};

      strengthWorkouts.forEach(w => {
        const exName = w.exercise;
        w.sets.forEach(s => {
          if (s.weight > 0 && s.reps > 0) {
            const rmVal = calcRM(s.weight, s.reps);
            if (!maxMap[exName] || rmVal > maxMap[exName].maxRm) {
              maxMap[exName] = {
                maxRm: rmVal,
                date: w.date,
                weight: s.weight,
                reps: s.reps
              };
            }
          }
        });
      });

      const exercises = Object.keys(maxMap);

      if (exercises.length === 0) {
        displayArea.innerHTML = `<div class="empty-state">最高RMの記録が見つかりませんでした。</div>`;
        return;
      }

      exercises.sort();

      let html = '';
      exercises.forEach(exName => {
        const item = maxMap[exName];
        const rmFormatted = item.maxRm.toFixed(1);
        const wFormatted = Number(item.weight).toFixed(1);

        html += `
          <div class="max-rm-card">
            <div class="max-rm-title">${exName}</div>
            <div class="max-rm-subrow">
              <span class="max-rm-date">${item.date}</span>
              <span class="max-rm-divider">｜</span>
              <span class="max-rm-val">${rmFormatted} kg</span>
              <span class="max-rm-divider">｜</span>
              <span class="max-rm-actual">(${wFormatted}kg × ${item.reps})</span>
            </div>
          </div>
        `;
      });

      displayArea.innerHTML = html;
    }

    // 過去（対象日付より前）の最高1RMを取得する関数
    function getHistoricalMaxRM(exerciseName, targetDate) {
      let historicalMax = 0;
      workouts.forEach(w => {
        if (w.exercise === exerciseName && !w.isCardio && w.sets && w.date < targetDate) {
          w.sets.forEach(s => {
            const rm = calcRM(s.weight, s.reps);
            if (rm > historicalMax) historicalMax = rm;
          });
        }
      });
      return historicalMax;
    }

      document.getElementById('cardio-speed').value = '';
      document.getElementById('cardio-distance').value = '';

      updatePartSelectOptions(targetPart, targetExercise);
      
      if (isEdit && targetPart && targetExercise) {

    function updateSummaryModalContent() {
      document.getElementById('summary-modal-main-title').textContent = `${summaryViewYear}年 ${summaryViewMonth + 1}月 サマリ`;
      document.getElementById('summary-cal-title').textContent = `${summaryViewYear}年 ${summaryViewMonth + 1}月`;

      const monthWorkouts = workouts.filter(w => {
        const d = new Date(w.date);
        return d.getFullYear() === summaryViewYear && d.getMonth() === summaryViewMonth;
      });

      let totalTonnage = 0;
      let activeDaysSet = new Set();
      let totalSetsCount = 0;
      let totalRepsCount = 0;
      let partStats = {};

      monthWorkouts.forEach(w => {
        activeDaysSet.add(w.date);
        if (!partStats[w.part]) {
          partStats[w.part] = { days: new Set(), sets: 0, tonnage: 0 };
        }
        partStats[w.part].days.add(w.date);

        if (w.isCardio) {
          totalSetsCount++;
          partStats[w.part].sets++;
        } else if (w.sets) {
          w.sets.forEach(s => {
            const ton = (s.weight * s.reps) / 1000;
            totalTonnage += ton;
            totalSetsCount++;
            totalRepsCount += s.reps;
            partStats[w.part].sets++;
            partStats[w.part].tonnage += ton;
          });
        }
      });

      document.getElementById('sum-days').textContent = `${activeDaysSet.size} days`;
      document.getElementById('sum-ton').textContent = `${totalTonnage.toFixed(2)} t`;
      document.getElementById('sum-sets').textContent = `${totalSetsCount} sets`;
      document.getElementById('sum-reps').textContent = `${totalRepsCount} reps`;

      const partsListEl = document.getElementById('summary-parts-list');
      const partsKeys = Object.keys(partStats);
      if (partsKeys.length === 0) {
        partsListEl.innerHTML = '集計データはありません';
      } else {
        let pHtml = '';
        partsKeys.forEach(p => {
          const st = partStats[p];
          pHtml += `<div style="display:flex; justify-content:space-between; margin-bottom:6px; border-bottom:1px solid #2c2c2e; padding-bottom:4px;">
            <span style="color:var(--text-main); font-weight:600;">${p}</span>
            <span>セット: ${st.sets} / 負荷: ${st.tonnage.toFixed(2)}t</span>
          </div>`;
        });
        partsListEl.innerHTML = pHtml;
      }

      const grid = document.getElementById('summary-calendar-grid');
      const dows = grid.querySelectorAll('.calendar-dow');
      grid.innerHTML = '';
      dows.forEach(el => grid.appendChild(el));

      const firstDay = new Date(summaryViewYear, summaryViewMonth, 1).getDay();
      const lastDate = new Date(summaryViewYear, summaryViewMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'calendar-day empty';
        grid.appendChild(empty);
      }

      for (let d = 1; d <= lastDate; d++) {
        const cell = document.createElement('div');
        cell.className = 'calendar-day';
        cell.textContent = d;
        const dateStr = `${summaryViewYear}-${String(summaryViewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        if (activeDaysSet.has(dateStr)) cell.classList.add('active');
        grid.appendChild(cell);
      }
    }

    function updatePartSelectOptions(selectedPart = null, selectedExercise = null) {
      const partSelect = document.getElementById('input-part');
      partSelect.innerHTML = '';
      const allParts = getAllParts();
      allParts.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        partSelect.appendChild(opt);
      });
      const addOpt = document.createElement('option');
      addOpt.value = '__ADD_NEW_PART__';
      addOpt.textContent = '＋ 新しい部位を追加...';
      partSelect.appendChild(addOpt);

      if (selectedPart && allParts.includes(selectedPart)) {
        partSelect.value = selectedPart;
      }
      onPartChange(selectedExercise);
    }

    function onPartChange(selectedExercise = null) {
      const partSelect = document.getElementById('input-part');
      if (partSelect.value === '__ADD_NEW_PART__') {
        const newPart = prompt('新しい部位名を入力してください:');
        if (newPart && newPart.trim() !== '') {
          const trimmed = newPart.trim();
          if (!customParts.includes(trimmed)) {
            customParts.push(trimmed);
            localStorage.setItem('gym_custom_parts', JSON.stringify(customParts));
          }
          updatePartSelectOptions(trimmed, selectedExercise);
          return;
        } else {
          partSelect.selectedIndex = 0;
        }
      }

      const part = partSelect.value;
      const select = document.getElementById('input-exercise-select');
      select.innerHTML = '';
      const userList = customExercises[part] || [];
      userList.forEach(ex => {
        const opt = document.createElement('option');
        opt.value = ex;
        opt.textContent = ex;
        select.appendChild(opt);
      });
      const customOpt = document.createElement('option');
      customOpt.value = '__ADD_NEW__';
      customOpt.textContent = '＋ 新しい種目を追加...';
      select.appendChild(customOpt);

      if (selectedExercise && (userList.includes(selectedExercise) || selectedExercise === '__ADD_NEW__')) {
        select.value = selectedExercise;
      } else {
        select.selectedIndex = 0;
      }

      const isCardio = (part === '有酸素運動');
      document.getElementById('strength-input-area').style.display = isCardio ? 'none' : 'block';
      document.getElementById('cardio-input-area').style.display = isCardio ? 'block' : 'none';
      onExerciseChange();
    }

    function onExerciseChange() {
      const select = document.getElementById('input-exercise-select');
      const part = document.getElementById('input-part').value;

      if (select.value === '__ADD_NEW__') {
        const newEx = prompt('新しい種目名を入力してください:');
        if (newEx && newEx.trim() !== '') {
          const trimmed = newEx.trim();
          if (!customExercises[part]) customExercises[part] = [];
          if (!customExercises[part].includes(trimmed)) {
            customExercises[part].push(trimmed);
            localStorage.setItem('gym_custom_exercises', JSON.stringify(customExercises));
          }
          updatePartSelectOptions(part, trimmed);
          return;
        } else {
          select.selectedIndex = 0;
        }
      }

      const exerciseName = select.value;
      loadLastRecord(part, exerciseName);
    }

    // 厳密に選択日（selectedDate）より「前の日付」の最新記録を取得する関数
    function loadLastRecord(part, exercise) {
      const matches = workouts.filter(w => w.part === part && w.exercise === exercise && w.date < selectedDate);
      const boxDate = document.getElementById('last-record-date');
      const boxContent = document.getElementById('last-record-content');
      const copyBtn = document.getElementById('copy-last-btn');

      if (matches.length === 0 || !exercise || exercise === '__ADD_NEW__') {
        boxDate.textContent = '----/--/--';
        boxContent.innerHTML = '前回の記録はありません';
        copyBtn.style.display = 'none';
        currentLastRecordData = null;
        return;
      }
      matches.sort((a, b) => new Date(b.date) - new Date(a.date));
      const last = matches[0];
      currentLastRecordData = last;
      boxDate.textContent = last.date;
      copyBtn.style.display = 'inline-block';

      if (last.isCardio) {
        boxContent.innerHTML = `時間: ${last.cardio.time || '-'}分 / 距離: ${last.cardio.distance || '-'}km`;
      } else if (last.sets) {
        boxContent.innerHTML = last.sets.map((s, idx) => {
          const wStr = Number(s.weight).toFixed(1);
          const rm = calcRM(s.weight, s.reps).toFixed(1);
          return `<div style="margin-top:2px; font-weight:500;">Set ${idx + 1}: ${wStr} kg × ${s.reps} reps (1RM:${rm}kg)</div>`;
        }).join('');
      }
    }

    function copyLastRecordData() {
      if (!currentLastRecordData) return;
      if (currentLastRecordData.isCardio) {
        document.getElementById('cardio-time').value = currentLastRecordData.cardio.time || '';
        document.getElementById('cardio-speed').value = currentLastRecordData.cardio.speed || '';
        document.getElementById('cardio-distance').value = currentLastRecordData.cardio.distance || '';
        document.getElementById('cardio-cal').value = currentLastRecordData.cardio.cal || '';
      } else if (currentLastRecordData.sets && currentLastRecordData.sets.length > 0) {
        const container = document.getElementById('set-inputs-container');
        container.innerHTML = '';
        currentLastRecordData.sets.forEach((s) => {
          appendSetRow(s.weight, s.reps);
        });
        reindexSetRows();
      }
    }

    function initSetInputs() {
      const container = document.getElementById('set-inputs-container');
      container.innerHTML = '';
      for (let i = 0; i < 3; i++) appendSetRow();
      reindexSetRows();
    }

    function addSetInput() {
      appendSetRow();
      reindexSetRows();
    }

    function appendSetRow(weight = '', reps = '') {
      const container = document.getElementById('set-inputs-container');
      const div = document.createElement('div');
      div.className = 'set-row';
      
      div.innerHTML = `
        <div class="set-num">1</div>
        <div class="copy-weight-cell"></div>
        <input type="number" step="0.5" class="set-input set-weight" value="${weight !== '' ? weight : ''}" placeholder="kg" oninput="updateRMRow(this)">
        <div class="copy-reps-cell"></div>
        <input type="number" class="set-input set-reps" value="${reps !== '' ? reps : ''}" placeholder="回" oninput="updateRMRow(this)">
        <div class="set-rm">-</div>
        <button type="button" class="delete-set-btn" onclick="removeSetRow(this)">✕</button>
      `;
      container.appendChild(div);
      updateRMRow(div.querySelector('.set-weight'));
    }

    function removeSetRow(btn) {
      const row = btn.closest('.set-row');
      row.remove();
      reindexSetRows();
    }

    function reindexSetRows() {
      const rows = document.querySelectorAll('.set-row');
      rows.forEach((row, idx) => {
        const setNum = idx + 1;
        row.querySelector('.set-num').textContent = setNum;
        
        const copyWeightCell = row.querySelector('.copy-weight-cell');
        const copyRepsCell = row.querySelector('.copy-reps-cell');

        if (setNum > 1) {
          copyWeightCell.innerHTML = `<button type="button" class="copy-prev-btn" onclick="copyPreviousWeight(${setNum})" title="1つ上の重さをコピー">↪︎</button>`;
          copyRepsCell.innerHTML = `<button type="button" class="copy-prev-btn" onclick="copyPreviousReps(${setNum})" title="1つ上の回数をコピー">↪︎</button>`;
        } else {
          copyWeightCell.innerHTML = `<div></div>`;
          copyRepsCell.innerHTML = `<div></div>`;
        }
      });
    }

    function copyPreviousWeight(setIndex) {
      const rows = document.querySelectorAll('.set-row');
      if (setIndex < 2 || setIndex > rows.length) return;
      const currentRow = rows[setIndex - 1];
      const prevRow = rows[setIndex - 2];
      currentRow.querySelector('.set-weight').value = prevRow.querySelector('.set-weight').value;
      updateRMRow(currentRow.querySelector('.set-weight'));
    }

    function copyPreviousReps(setIndex) {
      const rows = document.querySelectorAll('.set-row');
      if (setIndex < 2 || setIndex > rows.length) return;
      const currentRow = rows[setIndex - 1];
      const prevRow = rows[setIndex - 2];
      currentRow.querySelector('.set-reps').value = prevRow.querySelector('.set-reps').value;
      updateRMRow(currentRow.querySelector('.set-reps'));
    }

    function updateRMRow(inputEl) {
      const row = inputEl.closest('.set-row');
      if (!row) return;
      const w = parseFloat(row.querySelector('.set-weight').value) || 0;
      const r = parseInt(row.querySelector('.set-reps').value) || 0;
      const rmEl = row.querySelector('.set-rm');
      if (w > 0 && r > 0) {
        const rm = calcRM(w, r).toFixed(1);
        rmEl.textContent = `${rm}kg`;
      } else {
        rmEl.textContent = '-';
      }
    }

    function saveRecord() {
      const date = selectedDate;
      const part = document.getElementById('input-part').value;
      const exercise = document.getElementById('input-exercise-select').value;
      const memo = document.getElementById('input-memo').value;

      if (!exercise || exercise === '__ADD_NEW__') { alert('種目名を選択してください'); return; }

      const isCardio = (part === '有酸素運動');

      if (isCardio) {
        let recordData = { id: Date.now(), date, part, exercise, isCardio, memo };
        recordData.cardio = {
          time: document.getElementById('cardio-time').value,
          speed: document.getElementById('cardio-speed').value,
          distance: document.getElementById('cardio-distance').value,
          cal: document.getElementById('cardio-cal').value
        };
        workouts = workouts.filter(w => !(w.date === date && w.part === part && w.exercise === exercise));
        workouts.push(recordData);
      } else {
        const rows = document.querySelectorAll('.set-row');
        const setsData = [];
        rows.forEach(row => {
          const weight = parseFloat(row.querySelector('.set-weight').value) || 0;
          const reps = parseInt(row.querySelector('.set-reps').value) || 0;
          if (weight > 0 || reps > 0) setsData.push({ weight, reps });
        });

        // 対象種目の記録を一度クリア
        workouts = workouts.filter(w => !(w.date === date && w.part === part && w.exercise === exercise));

        // セットが1つでも入力されていれば保存（未入力・空の場合は削除扱いとして追加しない）
        if (setsData.length > 0) {
          let recordData = { id: Date.now(), date, part, exercise, isCardio: false, memo, sets: setsData };
          workouts.push(recordData);
        }
      }

      localStorage.setItem('gym_workouts_v2', JSON.stringify(workouts));
      closeModal();
      renderHome();
    }

    function changeMonth(dir) {
      viewMonth += dir;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      renderHome();
    }

    function changeHistoryMonth(dir) {
      historyViewMonth += dir;
      if (historyViewMonth > 11) { historyViewMonth = 0; historyViewYear++; }
      if (historyViewMonth < 0) { historyViewMonth = 11; historyViewYear--; }
      renderHistoryCalendar();
    }

    function renderHome() {
      document.getElementById('cal-title').textContent = `${viewYear}年 ${viewMonth + 1}月`;

      const activeDaysSet = new Set(workouts.map(w => w.date));

      const monthActiveDays = workouts.filter(w => {
        const d = new Date(w.date);
        return d.getFullYear() === viewYear && d.getMonth() === viewMonth;
      });
      const uniqueMonthDays = new Set(monthActiveDays.map(w => w.date));
      document.getElementById('stat-month-days').textContent = `${uniqueMonthDays.size}days`;
      document.getElementById('stat-total-days').textContent = `${activeDaysSet.size}days`;

      const grid = document.getElementById('calendar-grid');
      const dows = grid.querySelectorAll('.calendar-dow');
      grid.innerHTML = '';
      dows.forEach(el => grid.appendChild(el));

      const firstDay = new Date(viewYear, viewMonth, 1).getDay();
      const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'calendar-day empty';
        grid.appendChild(empty);
      }

      for (let d = 1; d <= lastDate; d++) {
        const cell = document.createElement('div');
        cell.className = 'calendar-day';
        cell.textContent = d;
        const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        if (activeDaysSet.has(dateStr)) cell.classList.add('active');
        if (dateStr === selectedDate) cell.classList.add('selected');
        cell.onclick = () => {
          selectedDate = dateStr;
          renderHome();
        };
        grid.appendChild(cell);
      }

      const dayWorkouts = workouts.filter(w => w.date === selectedDate);
      const displayArea = document.getElementById('home-workout-display');

      if (dayWorkouts.length === 0) {
        displayArea.innerHTML = `<div class="empty-state">${selectedDate} のトレーニング記録はありません。</div>`;
      } else {
        const grouped = {};
        dayWorkouts.forEach(w => {
          if (!grouped[w.exercise]) {
            grouped[w.exercise] = { part: w.part, sets: [], memo: [] };
          }
          if (w.sets) grouped[w.exercise].sets.push(...w.sets);
          if (w.memo) grouped[w.exercise].memo.push(w.memo);
        });

        let html = `
          <div class="workout-day-view" id="share-capture-target">
            <div class="workout-day-title">${selectedDate} Workout</div>
        `;

        for (let exName in grouped) {
          const item = grouped[exName];
          // 今回のトレーニング日より前の歴代最高RMを取得
          const histMax = getHistoricalMaxRM(exName, selectedDate);
          
          let dayMaxRM = 0;
          item.sets.forEach(s => {
            const rm = calcRM(s.weight, s.reps);
            if (rm > dayMaxRM) dayMaxRM = rm;
          });

          let displayHeaderRM = Math.max(dayMaxRM, histMax);

          let setsHtml = item.sets.map((s, idx) => {
            const currentRM = calcRM(s.weight, s.reps);
            const currentRMFormatted = currentRM.toFixed(1);
            const wFormatted = Number(s.weight).toFixed(1) + ' kg';
            const rFormatted = s.reps + ' reps';

            let badgeHtml = '';

            // バッジ判定ロジック:
            // 1. 過去の歴代最高を上回っている場合（更新） ➔ 赤バッジ（その日の全更新セットが対象）
            // 2. 過去の歴代最高が存在し、それと同率タイの場合 ➔ ゴールドバッジ
            // 3. 過去データがなく今回初めて記録する場合 ➔ 赤バッジ
            // 4. それ以外（過去最高未満） ➔ 非表示
            if (histMax > 0) {
              if (currentRM > histMax + 0.05) {
                badgeHtml = '<span class="max-rm-badge red">MAX RM</span>';
              } else if (Math.abs(currentRM - histMax) <= 0.05) {
                badgeHtml = '<span class="max-rm-badge gold">MAX RM</span>';
              }
            } else if (currentRM > 0) {
              badgeHtml = '<span class="max-rm-badge red">MAX RM</span>';
            }

            return `
              <div class="history-set-row">
                <div class="set-num-col">${idx + 1}</div>
                <div class="set-weight-col">${wFormatted}</div>
                <div class="set-x-col">×</div>
                <div class="set-reps-col">${rFormatted}</div>
                <div class="set-rm-col">
                  <span>(1RM:${currentRMFormatted}kg)</span>
                  ${badgeHtml}
                </div>
              </div>
            `;
          }).join('');

          html += `
            <div class="history-card" onclick="openModal('${item.part}', '${exName}', true)">
              <div class="history-header-row">
                <div class="history-ex-title">${exName}</div>
                <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
                  <span style="font-size:0.8rem; font-weight:bold; color:var(--text-main);">RM : ${displayHeaderRM.toFixed(1)}kg</span>
                </div>
              </div>
              ${setsHtml}
            </div>
          `;
        }
        html += `</div>`;
        displayArea.innerHTML = html;
      }
    }

    function renderHistoryFilterTabs() {
      const container = document.getElementById('filter-tabs-container');
      const parts = ['ALL', ...getAllParts()];
      container.innerHTML = parts.map(p => `
        <button class="filter-tab ${currentHistoryPart === p ? 'active' : ''}" onclick="setHistoryFilterPart('${p}')" style="background:${currentHistoryPart === p ? 'var(--accent-red)' : '#2c2c2e'}; color:${currentHistoryPart === p ? 'white' : 'var(--text-sub)'}; border:none; padding:6px 14px; border-radius:20px; font-size:0.8rem; font-weight:600; white-space:nowrap; cursor:pointer;">${p}</button>
      `).join('');
    }

    function setHistoryFilterPart(part) {
      currentHistoryPart = part;
      renderHistoryFilterTabs();
      renderHistoryCalendar();
    }

    function renderHistoryCalendar() {
      document.getElementById('history-cal-title').textContent = `${historyViewYear}年 ${historyViewMonth + 1}月`;

      let targetWorkoutsForCalendar = workouts;
      if (currentHistoryPart !== 'ALL') {
        targetWorkoutsForCalendar = workouts.filter(w => w.part === currentHistoryPart);
      }
      const activeDaysSet = new Set(targetWorkoutsForCalendar.map(w => w.date));

      const grid = document.getElementById('history-calendar-grid');
      const dows = grid.querySelectorAll('.calendar-dow');
      grid.innerHTML = '';
      dows.forEach(el => grid.appendChild(el));

      const firstDay = new Date(historyViewYear, historyViewMonth, 1).getDay();
      const lastDate = new Date(historyViewYear, historyViewMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'calendar-day empty';
        grid.appendChild(empty);
      }

      for (let d = 1; d <= lastDate; d++) {
        const cell = document.createElement('div');
        cell.className = 'calendar-day';
        cell.textContent = d;
        const dateStr = `${historyViewYear}-${String(historyViewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        if (activeDaysSet.has(dateStr)) {
          cell.classList.add('active');
          cell.onclick = () => {
            selectedDate = dateStr;
            switchTab('home', document.querySelectorAll('.nav-item')[0]);
            renderHome();
          };
        } else {
          cell.style.opacity = '0.3';
          cell.style.cursor = 'default';
        }
        grid.appendChild(cell);
      }

      const timelineDisplay = document.getElementById('history-timeline-display');
      if (currentHistoryPart === 'ALL') {
        timelineDisplay.innerHTML = '';
      } else {
        const now = new Date();
        const threeMonthsAgo = new Date();
        threeMonthsAgo.setMonth(now.getMonth() - 3);

        const targetWorkouts = workouts.filter(w => {
          if (w.part !== currentHistoryPart) return false;
          const wDate = new Date(w.date);
          return wDate >= threeMonthsAgo;
        });

        targetWorkouts.sort((a, b) => new Date(b.date) - new Date(a.date));

        if (targetWorkouts.length === 0) {
          timelineDisplay.innerHTML = `<div class="empty-state" style="margin-top: 16px;">直近3ヶ月以内の「${currentHistoryPart}」の記録はありません。</div>`;
          return;
        }

        let html = `<div style="font-size: 0.9rem; font-weight: bold; color: var(--accent-red); margin: 16px 0 10px 0;">■ ${currentHistoryPart} の直近履歴（過去3ヶ月）</div>`;
        
        targetWorkouts.forEach(w => {
          const histMax = getHistoricalMaxRM(w.exercise, w.date);
          let dayMaxRM = 0;
          if (w.sets) {
            w.sets.forEach(s => {
              const rm = calcRM(s.weight, s.reps);
              if (rm > dayMaxRM) dayMaxRM = rm;
            });
          }

          let displayHeaderRM = Math.max(dayMaxRM, histMax);

          let setsHtml = w.sets ? w.sets.map((s, idx) => {
            const currentRM = calcRM(s.weight, s.reps);
            const currentRMFormatted = currentRM.toFixed(1);
            const wFormatted = Number(s.weight).toFixed(1) + ' kg';
            const rFormatted = s.reps + ' reps';

            let badgeHtml = '';
            if (histMax > 0) {
              if (currentRM > histMax + 0.05) {
                badgeHtml = '<span class="max-rm-badge red">MAX RM</span>';
              } else if (Math.abs(currentRM - histMax) <= 0.05) {
                badgeHtml = '<span class="max-rm-badge gold">MAX RM</span>';
              }
            } else if (currentRM > 0) {
              badgeHtml = '<span class="max-rm-badge red">MAX RM</span>';
            }

            return `
              <div class="history-set-row">
                <div class="set-num-col">${idx + 1}</div>
                <div class="set-weight-col">${wFormatted}</div>
                <div class="set-x-col">×</div>
                <div class="set-reps-col">${rFormatted}</div>
                <div class="set-rm-col">
                  <span>(1RM:${currentRMFormatted}kg)</span>
                  ${badgeHtml}
                </div>
              </div>
            `;
          }).join('') : '';

          html += `
            <div class="history-card" onclick="selectedDate = '${w.date}'; switchTab('home', document.querySelectorAll('.nav-item')[0]); renderHome();">
              <div style="font-size: 0.75rem; color: var(--text-sub); margin-bottom: 2px;">${w.date}</div>
              <div class="history-header-row">
                <div class="history-ex-title">${w.exercise}</div>
                <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
                  <span style="font-size:0.8rem; font-weight:bold; color:var(--text-main);">RM : ${displayHeaderRM.toFixed(1)}kg</span>
                </div>
              </div>
              ${setsHtml}
            </div>
          `;
        });

        timelineDisplay.innerHTML = html;
      }
    }

    function openManageModal() {
      const area = document.getElementById('manage-content-area');
      let html = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <div style="font-weight:bold; color:var(--accent-red);">【部位リスト】</div>
        <button class="manage-btn" style="background:var(--accent-red); color:white;" onclick="addNewPartFromManage()">＋ 部位を追加</button>
      </div>`;

      customParts.forEach((p, idx) => {
        html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; background:#2c2c2e; padding:8px; border-radius:8px;">
          <span>${p}</span>
          <div>
            <button class="manage-btn" onclick="movePart(${idx}, -1)">▲</button>
            <button class="manage-btn" onclick="movePart(${idx}, 1)" style="margin-left:2px;">▼</button>
            <button class="manage-btn" onclick="renamePart(${idx})" style="margin-left:4px;">修正</button>
            <button class="manage-btn" style="color:#ff453a; margin-left:4px;" onclick="deletePart(${idx})">削除</button>
          </div>
        </div>`;
      });

      html += `<div style="margin:20px 0 15px 0; font-weight:bold; color:var(--accent-red);">【種目リスト】</div>`;
      let hasExercises = false;
      for (let part in customExercises) {
        if (customExercises[part] && customExercises[part].length > 0) {
          hasExercises = true;
          html += `<div style="font-size:0.8rem; color:var(--text-sub); margin-top:8px; margin-bottom:4px;">■ ${part}</div>`;
          customExercises[part].forEach((ex, exIdx) => {
            html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; background:#2c2c2e; padding:6px 10px; border-radius:8px;">
              <span style="font-size:0.85rem;">${ex}</span>
              <div>
                <button class="manage-btn" onclick="moveExercise('${part}', ${exIdx}, -1)">▲</button>
                <button class="manage-btn" onclick="moveExercise('${part}', ${exIdx}, 1)" style="margin-left:2px;">▼</button>
                <button class="manage-btn" onclick="changeExerciseParent('${part}', ${exIdx})" style="margin-left:4px;">移動</button>
                <button class="manage-btn" onclick="renameExercise('${part}', ${exIdx})" style="margin-left:4px;">修正</button>
                <button class="manage-btn" style="color:#ff453a; margin-left:4px;" onclick="deleteExercise('${part}', ${exIdx})">削除</button>
              </div>
            </div>`;
          });
        }
      }
      if (!hasExercises) {
        html += `<div style="font-size:0.85rem; color:var(--text-sub);">登録された種目はまだありません。</div>`;
      }

      area.innerHTML = html;
      document.getElementById('manage-modal').classList.add('open');
    }

    function closeManageModal() {
      document.getElementById('manage-modal').classList.remove('open');
      renderHome();
    }

    function addNewPartFromManage() {
      const newPart = prompt('新しい部位名を入力してください:');
      if (newPart && newPart.trim() !== '') {
        const trimmed = newPart.trim();
        if (!customParts.includes(trimmed)) {
          customParts.push(trimmed);
          localStorage.setItem('gym_custom_parts', JSON.stringify(customParts));
          openManageModal();
        } else {
          alert('その部位はすでに存在します。');
        }
      }
    }

    function movePart(idx, dir) {
      const targetIdx = idx + dir;
      if (targetIdx < 0 || targetIdx >= customParts.length) return;
      const temp = customParts[idx];
      customParts[idx] = customParts[targetIdx];
      customParts[targetIdx] = temp;
      localStorage.setItem('gym_custom_parts', JSON.stringify(customParts));
      openManageModal();
    }

    function moveExercise(part, exIdx, dir) {
      const list = customExercises[part];
      const targetIdx = exIdx + dir;
      if (targetIdx < 0 || targetIdx >= list.length) return;
      const temp = list[exIdx];
      list[exIdx] = list[targetIdx];
      list[targetIdx] = temp;
      localStorage.setItem('gym_custom_exercises', JSON.stringify(customExercises));
      openManageModal();
    }

    function changeExerciseParent(oldPart, exIdx) {
      const exName = customExercises[oldPart][exIdx];
      const newPart = prompt(`「${exName}」の移動先（新しい部位名）を入力してください:`, oldPart);
      if (newPart && newPart.trim() !== '' && newPart !== oldPart) {
        const trimmed = newPart.trim();
        if (!customParts.includes(trimmed)) {
          customParts.push(trimmed);
          localStorage.setItem('gym_custom_parts', JSON.stringify(customParts));
        }
        customExercises[oldPart].splice(exIdx, 1);
        if (!customExercises[trimmed]) customExercises[trimmed] = [];
        customExercises[trimmed].push(exName);
        localStorage.setItem('gym_custom_exercises', JSON.stringify(customExercises));
        openManageModal();
      }
    }

    function renamePart(idx) {
      const oldName = customParts[idx];
      const newName = prompt('部位名を修正してください:', oldName);
      if (newName && newName.trim() !== '') {
        const trimmed = newName.trim();
        customParts[idx] = trimmed;
        if (customExercises[oldName]) {
          customExercises[trimmed] = customExercises[oldName];
          delete customExercises[oldName];
        }
        localStorage.setItem('gym_custom_parts', JSON.stringify(customParts));
        localStorage.setItem('gym_custom_exercises', JSON.stringify(customExercises));
        openManageModal();
      }
    }

    function deletePart(idx) {
      const target = customParts[idx];
      if (confirm(`部位「${target}」を削除しますか？`)) {
        customParts.splice(idx, 1);
        delete customExercises[target];
        localStorage.setItem('gym_custom_parts', JSON.stringify(customParts));
        localStorage.setItem('gym_custom_exercises', JSON.stringify(customExercises));
        openManageModal();
      }
    }

    function renameExercise(part, exIdx) {
      const oldName = customExercises[part][exIdx];
      const newName = prompt('種目名を修正してください:', oldName);
      if (newName && newName.trim() !== '') {
        customExercises[part][exIdx] = newName.trim();
        localStorage.setItem('gym_custom_exercises', JSON.stringify(customExercises));
        openManageModal();
      }
    }

    function deleteExercise(part, exIdx) {
      const target = customExercises[part][exIdx];
      if (confirm(`種目「${target}」を削除しますか？`)) {
        customExercises[part].splice(exIdx, 1);
        localStorage.setItem('gym_custom_exercises', JSON.stringify(customExercises));
        openManageModal();
      }
    }

    renderHome();
  </script>
</body>
</html>
