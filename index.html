<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GYM-MEMO</title>
  <style>
    :root {
      --bg-dark: #121214;
      --card-bg: #1c1c1e;
      --accent-red: #ff453a;
      --text-main: #ffffff;
      --text-sub: #8e8e93;
      --border-color: #2c2c2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: max(24px, env(safe-area-inset-top) + 16px) 16px 90px 16px;
      max-width: 500px;
      margin: 0 auto;
    }
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 20px 0; }
    h1 { font-size: 1.5rem; color: var(--accent-red); font-weight: 700; }
    .card { background-color: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
    
    .summary-title { font-size: 1.25rem; font-weight: 700; color: var(--text-main); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    .summary-value { font-size: 2.2rem; font-weight: 800; }
    .summary-unit { font-size: 1rem; color: var(--text-sub); }
    .summary-stats { display: flex; gap: 20px; margin-top: 15px; font-size: 0.85rem; color: var(--text-sub); }
    
    /* カレンダー */
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 600; font-size: 0.95rem; }
    .cal-btn { background: none; border: none; color: var(--accent-red); font-size: 1.1rem; cursor: pointer; padding: 4px 8px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 0.75rem; }
    .calendar-dow { color: var(--text-sub); padding-bottom: 4px; font-weight: 600; }
    .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--text-main); background: #2c2c2e; font-size: 0.75rem; }
    .calendar-day.active { background-color: var(--accent-red); font-weight: bold; }
    .calendar-day.empty { background: transparent; }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .btn { background-color: var(--accent-red); color: white; border: none; border-radius: 14px; padding: 16px; font-weight: bold; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-secondary { background-color: #2c2c2e; color: #0a84ff; }
    .history-head { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; }
    .empty-state { background-color: var(--card-bg); border-radius: 12px; padding: 30px 20px; text-align: center; color: var(--text-sub); font-size: 0.9rem; }

    /* 履歴表示 */
    .history-card { background-color: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border-color); }
    .history-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .history-date { font-weight: bold; color: var(--accent-red); font-size: 0.95rem; }
    .history-part { background: #2c2c2e; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; color: var(--text-sub); }
    .history-set-item { font-size: 0.85rem; color: var(--text-main); margin-top: 4px; }
    .delete-btn { background: none; border: none; color: #ff453a; font-size: 0.8rem; cursor: pointer; }

    /* モーダル共通 */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: flex-end; z-index: 100; }
    .modal.open { display: flex; }
    .modal-content { background: var(--card-bg); width: 100%; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 20px 16px 40px 16px; border-top: 1px solid var(--border-color); }
    
    .modal-header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .exercise-title-header { font-size: 1.3rem; font-weight: bold; color: var(--accent-red); text-align: center; }
    
    .last-record-box { background: #2c2c2e; border-radius: 12px; padding: 12px; margin-bottom: 20px; font-size: 0.85rem; }
    .last-record-title { color: #0a84ff; font-weight: bold; margin-bottom: 6px; display: flex; justify-content: space-between; }

    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 6px; display: block; }
    .form-input, .form-select { width: 100%; background: #2c2c2e; border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 10px; font-size: 0.95rem; }

    .set-row { display: grid; grid-template-columns: 40px 1fr 1fr 60px; gap: 8px; align-items: center; margin-bottom: 10px; background: #252528; padding: 8px 10px; border-radius: 10px; }
    .set-num { font-weight: bold; color: var(--accent-red); text-align: center; font-size: 0.9rem; }
    .set-input { width: 100%; background: #1c1c1e; border: 1px solid var(--border-color); color: white; padding: 8px; border-radius: 8px; font-size: 0.95rem; text-align: center; }
    .set-rm { font-size: 0.75rem; color: var(--text-sub); text-align: center; }

    .add-set-btn { width: 100%; background: #2c2c2e; color: #34c759; border: 1px dashed #34c759; padding: 12px; border-radius: 10px; font-weight: bold; margin-top: 10px; cursor: pointer; }
    .submit-btn { width: 100%; background: var(--accent-red); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 1rem; margin-top: 20px; cursor: pointer; }
    .close-modal { width: 100%; background: #2c2c2e; color: var(--text-main); border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 0.95rem; margin-top: 8px; cursor: pointer; }

    .summary-card-inner { background: #121214; border: 2px solid var(--accent-red); border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>GYM-MEMO</h1>
    <span>⚙️</span>
  </header>

  <div class="card">
    <div class="summary-title">
      <span id="current-month-label">2026年 11月</span>
    </div>
    <div class="summary-value"><span id="total-weight">0.00</span> <span class="summary-unit">t</span></div>
    <div class="summary-stats">
      <span id="total-days">トレ日数: 0 日</span>
      <span id="total-sets">総セット数: 0 セット</span>
    </div>

    <!-- カレンダー -->
    <div class="calendar-container" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border-color);">
      <div class="cal-header">
        <button class="cal-btn" onclick="changeMonth(-1)">◀</button>
        <span id="cal-title">2026年 11月</span>
        <button class="cal-btn" onclick="changeMonth(1)">▶</button>
      </div>
      <div class="calendar-grid" id="calendar-grid">
        <div class="calendar-dow">日</div><div class="calendar-dow">月</div><div class="calendar-dow">火</div>
        <div class="calendar-dow">水</div><div class="calendar-dow">木</div><div class="calendar-dow">金</div>
        <div class="calendar-dow">土</div>
      </div>
    </div>
  </div>

  <div class="btn-grid">
    <button class="btn" onclick="openModal()">＋ 今日のトレーニング追加</button>
    <button class="btn btn-secondary" onclick="openSummaryModal()">📷 月間サマリー画像</button>
  </div>

  <div class="history-head">トレーニング履歴</div>
  <div id="history-area">
    <div class="empty-state">記録はまだありません。</div>
  </div>

  <!-- 記録入力モーダル -->
  <div class="modal" id="record-modal">
    <div class="modal-content">
      <div class="modal-header-nav">
        <div class="exercise-title-header" id="header-exercise-name">種目を選択してください</div>
      </div>

      <div class="form-group">
        <label class="form-label">日付</label>
        <input type="date" id="input-date" class="form-input">
      </div>

      <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="form-group">
          <label class="form-label">部位</label>
          <select id="input-part" class="form-select" onchange="onPartChange()">
            <option value="胸">胸</option>
            <option value="背中">背中</option>
            <option value="脚">脚</option>
            <option value="肩">肩</option>
            <option value="腕">腕</option>
            <option value="腹">腹</option>
            <option value="有酸素運動">有酸素運動</option>
            <option value="その他">その他</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">種目名</label>
          <select id="input-exercise-select" class="form-select" onchange="onExerciseChange()">
            <!-- JSで動的切り替え -->
          </select>
        </div>
      </div>

      <!-- 前回記録（Last Record） -->
      <div class="last-record-box" id="last-record-box">
        <div class="last-record-title">
          <span>Last Record</span>
          <span id="last-record-date">----/--/--</span>
        </div>
        <div id="last-record-content" style="color: var(--text-sub);">前回の記録はありません</div>
      </div>

      <!-- 筋トレ用セット入力エリア -->
      <div id="strength-input-area">
        <div style="display: grid; grid-template-columns: 40px 1fr 1fr 60px; gap: 8px; font-size: 0.75rem; color: var(--text-sub); text-align: center; margin-bottom: 6px;">
          <div>セット</div><div>重さ (kg)</div><div>回数 (reps)</div><div>推定1RM</div>
        </div>
        <div id="set-inputs-container"></div>
        <button class="add-set-btn" onclick="addSetInput()">＋ セットを追加</button>
      </div>

      <!-- 有酸素運動用入力エリア -->
      <div id="cardio-input-area" style="display: none;">
        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label class="form-label">運動時間 (分)</label>
            <input type="number" id="cardio-time" class="form-input" placeholder="30">
          </div>
          <div class="form-group">
            <label class="form-label">速度 (km/h)</label>
            <input type="number" step="0.1" id="cardio-speed" class="form-input" placeholder="10.0">
          </div>
        </div>
        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label class="form-label">距離 (km)</label>
            <input type="number" step="0.01" id="cardio-distance" class="form-input" placeholder="5.0">
          </div>
          <div class="form-group">
            <label class="form-label">消費カロリー (kcal)</label>
            <input type="number" id="cardio-cal" class="form-input" placeholder="300">
          </div>
        </div>
      </div>

      <div class="form-group" style="margin-top: 15px;">
        <label class="form-label">メモ (任意)</label>
        <input type="text" id="input-memo" class="form-input" placeholder="フォームや感想など">
      </div>

      <button class="submit-btn" onclick="saveRecord()">記録を保存する</button>
      <button class="close-modal" onclick="closeModal()">キャンセル</button>
    </div>
  </div>

  <!-- 月間サマリーモーダル -->
  <div class="modal" id="summary-modal">
    <div class="modal-content">
      <div class="modal-header-nav">
        <div class="exercise-title-header">月間トレーニングサマリー</div>
      </div>
      
      <div class="summary-card-inner">
        <div id="summary-modal-title" style="font-size: 1.1rem; color: var(--accent-red); font-weight: bold; margin-bottom: 12px;">2026年 11月</div>
        <div style="font-size: 2.5rem; font-weight: 800; margin-bottom: 4px;"><span id="summary-modal-ton">0.00</span> <span style="font-size: 1rem; color: var(--text-sub);">t</span></div>
        <div style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 20px;">総負荷量 (Tonnage)</div>
        <div style="display: flex; justify-content: space-around; border-top: 1px solid var(--border-color); padding-top: 15px;">
          <div>
            <div style="font-size: 1.2rem; font-weight: bold;" id="summary-modal-days">0 日</div>
            <div style="font-size: 0.75rem; color: var(--text-sub);">トレーニング日数</div>
          </div>
          <div>
            <div style="font-size: 1.2rem; font-weight: bold;" id="summary-modal-sets">0 セット</div>
            <div style="font-size: 0.75rem; color: var(--text-sub);">総セット数</div>
          </div>
        </div>
      </div>

      <button class="close-modal" onclick="closeSummaryModal()">閉じる</button>
    </div>
  </div>

  <script>
    const presetExercises = {
      '胸': ['ベンチプレス', 'インクラインチェストプレス', 'ダンベルフライ', 'ペックフライ', 'ディップス'],
      '背中': ['ラテラルロー (マシン)', 'ラットプルダウン', 'デッドリフト', 'ベントオーバーロー', 'シーテッドロー'],
      '脚': ['スクワット', 'レッグプレス', 'レッグエクステンション', 'レッグカール', 'ブルガリアンスクワット'],
      '肩': ['ショルダープレス', 'サイドレイズ', 'フロントレイズ', 'リアレイズ'],
      '腕': ['アームカール', 'インクラインダンベルカール', 'ライイング・トライセプス・エクステンション', 'ケーブルプレスダウン'],
      '腹': ['クランチ', 'レッグレイズ', 'アブローラー'],
      '有酸素運動': ['ウォーキング', 'ランニング', '水泳'],
      'その他': ['有酸素運動(旧)', 'ストレッチ']
    };

    let customExercises = JSON.parse(localStorage.getItem('gym_custom_exercises')) || {};
    let workouts = JSON.parse(localStorage.getItem('gym_workouts_v2')) || [];
    let viewYear = new Date().getFullYear();
    let viewMonth = new Date().getMonth();
    let currentSetCount = 0;

    function openModal() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('input-date').value = today;
      document.getElementById('input-memo').value = '';
      document.getElementById('cardio-time').value = '';
      document.getElementById('cardio-speed').value = '';
      document.getElementById('cardio-distance').value = '';
      document.getElementById('cardio-cal').value = '';

      onPartChange();
      document.getElementById('record-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('record-modal').classList.remove('open');
    }

    function openSummaryModal() {
      document.getElementById('summary-modal-title').textContent = `${viewYear}年 ${viewMonth + 1}月`;
      
      const monthWorkouts = workouts.filter(w => {
        const d = new Date(w.date);
        return d.getFullYear() === viewYear && d.getMonth() === viewMonth;
      });

      let totalTonnage = 0;
      let activeDaysSet = new Set();
      let totalSetsCount = 0;

      monthWorkouts.forEach(w => {
        activeDaysSet.add(w.date);
        if (w.isCardio) {
          totalSetsCount++; // 有酸素も1回分としてカウント
        } else if (w.sets) {
          w.sets.forEach(s => {
            totalTonnage += (s.weight * s.reps) / 1000;
            totalSetsCount++;
          });
        }
      });

      document.getElementById('summary-modal-ton').textContent = totalTonnage.toFixed(2);
      document.getElementById('summary-modal-days').textContent = `${activeDaysSet.size} 日`;
      document.getElementById('summary-modal-sets').textContent = `${totalSetsCount} セット`;

      document.getElementById('summary-modal').classList.add('open');
    }

    function closeSummaryModal() {
      document.getElementById('summary-modal').classList.remove('open');
    }

    function onPartChange() {
      const part = document.getElementById('input-part').value;
      const select = document.getElementById('input-exercise-select');
      select.innerHTML = '';

      const defaultList = presetExercises[part] || [];
      const userList = customExercises[part] || [];
      const fullList = [...new Set([...defaultList, ...userList])];

      fullList.forEach(ex => {
        const opt = document.createElement('option');
        opt.value = ex;
        opt.textContent = ex;
        select.appendChild(opt);
      });

      const customOpt = document.createElement('option');
      customOpt.value = '__ADD_NEW__';
      customOpt.textContent = '＋ 新しい種目を追加...';
      select.appendChild(customOpt);

      // 有酸素か筋トレかで表示エリアを切り替え
      const isCardio = (part === '有酸素運動');
      document.getElementById('strength-input-area').style.display = isCardio ? 'none' : 'block';
      document.getElementById('cardio-input-area').style.display = isCardio ? 'block' : 'none';

      onExerciseChange();
    }

    function onExerciseChange() {
      const select = document.getElementById('input-exercise-select');
      const part = document.getElementById('input-part').value;

      if (select.value === '__ADD_NEW__') {
        const newEx = prompt('新しい種目名を入力してください:');
        if (newEx && newEx.trim() !== '') {
          const trimmed = newEx.trim();
          if (!customExercises[part]) customExercises[part] = [];
          customExercises[part].push(trimmed);
          localStorage.setItem('gym_custom_exercises', JSON.stringify(customExercises));
          onPartChange();
          select.value = trimmed;
        } else {
          select.selectedIndex = 0;
        }
      }

      const exerciseName = select.value;
      document.getElementById('header-exercise-name').textContent = exerciseName;
      loadLastRecord(part, exerciseName);

      if (part !== '有酸素運動') {
        initSetInputs();
      }
    }

    function loadLastRecord(part, exercise) {
      const matches = workouts.filter(w => w.part === part && w.exercise === exercise);
      const boxDate = document.getElementById('last-record-date');
      const boxContent = document.getElementById('last-record-content');

      if (matches.length === 0) {
        boxDate.textContent = '----/--/--';
        boxContent.innerHTML = '前回の記録はありません';
        return;
      }

      matches.sort((a, b) => new Date(b.date) - new Date(a.date));
      const last = matches[0];

      boxDate.textContent = last.date;
      if (last.isCardio) {
        boxContent.innerHTML = `時間: ${last.cardio.time || '-'}分 / 距離: ${last.cardio.distance || '-'}km / カロリー: ${last.cardio.cal || '-'}kcal`;
      } else if (last.sets) {
        boxContent.innerHTML = last.sets.map((s, idx) => 
          `<div style="margin-top:2px; font-weight:500;">Set ${idx + 1}: ${s.weight} kg × ${s.reps} reps</div>`
        ).join('');
      }
    }

    function initSetInputs() {
      const container = document.getElementById('set-inputs-container');
      container.innerHTML = '';
      currentSetCount = 0;
      for (let i = 0; i < 3; i++) {
        addSetInput();
      }
    }

    function addSetInput() {
      currentSetCount++;
      const container = document.getElementById('set-inputs-container');
      const div = document.createElement('div');
      div.className = 'set-row';
      div.innerHTML = `
        <div class="set-num">${currentSetCount}</div>
        <input type="number" step="0.5" class="set-input set-weight" placeholder="kg" oninput="updateRM(${currentSetCount})">
        <input type="number" class="set-input set-reps" placeholder="回" oninput="updateRM(${currentSetCount})">
        <div class="set-rm" id="rm-val-${currentSetCount}">-</div>
      `;
      container.appendChild(div);
    }

    function updateRM(setIndex) {
      const rows = document.querySelectorAll('.set-row');
      const row = rows[setIndex - 1];
      if (!row) return;

      const w = parseFloat(row.querySelector('.set-weight').value) || 0;
      const r = parseInt(row.querySelector('.set-reps').value) || 0;
      const rmEl = document.getElementById(`rm-val-${setIndex}`);

      if (w > 0 && r > 0) {
        const rm = Math.round(w * (1 + r / 30));
        rmEl.textContent = `${rm}kg`;
      } else {
        rmEl.textContent = '-';
      }
    }

    function saveRecord() {
      const date = document.getElementById('input-date').value;
      const part = document.getElementById('input-part').value;
      const exercise = document.getElementById('input-exercise-select').value;
      const memo = document.getElementById('input-memo').value;

      if (!date) { alert('日付を入力してください'); return; }

      const isCardio = (part === '有酸素運動');
      let recordData = {
        id: Date.now(),
        date,
        part,
        exercise,
        isCardio,
        memo
      };

      if (isCardio) {
        const time = document.getElementById('cardio-time').value;
        const speed = document.getElementById('cardio-speed').value;
        const distance = document.getElementById('cardio-distance').value;
        const cal = document.getElementById('cardio-cal').value;
        recordData.cardio = { time, speed, distance, cal };
      } else {
        const rows = document.querySelectorAll('.set-row');
        const setsData = [];
        rows.forEach(row => {
          const weight = parseFloat(row.querySelector('.set-weight').value) || 0;
          const reps = parseInt(row.querySelector('.set-reps').value) || 0;
          if (weight > 0 || reps > 0) {
            setsData.push({ weight, reps });
          }
        });
        if (setsData.length === 0) {
          alert('少なくとも1セット分の重さと回数を入力してください');
          return;
        }
        recordData.sets = setsData;
      }

      workouts.push(recordData);
      localStorage.setItem('gym_workouts_v2', JSON.stringify(workouts));
      closeModal();
      render();
    }

    function deleteRecord(id) {
      if (confirm('この記録を削除しますか？')) {
        workouts = workouts.filter(w => w.id !== id);
        localStorage.setItem('gym_workouts_v2', JSON.stringify(workouts));
        render();
      }
    }

    function changeMonth(dir) {
      viewMonth += dir;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      render();
    }

    function render() {
      document.getElementById('cal-title').textContent = `${viewYear}年 ${viewMonth + 1}月`;
      document.getElementById('current-month-label').textContent = `${viewYear}年 ${viewMonth + 1}月`;

      const monthWorkouts = workouts.filter(w => {
        const d = new Date(w.date);
        return d.getFullYear() === viewYear && d.getMonth() === viewMonth;
      });

      let totalTonnage = 0;
      let activeDaysSet = new Set();
      let totalSetsCount = 0;

      monthWorkouts.forEach(w => {
        activeDaysSet.add(w.date);
        if (w.isCardio) {
          totalSetsCount++;
        } else if (w.sets) {
          w.sets.forEach(s => {
            totalTonnage += (s.weight * s.reps) / 1000;
            totalSetsCount++;
          });
        }
      });

      document.getElementById('total-weight').textContent = totalTonnage.toFixed(2);
      document.getElementById('total-days').textContent = `トレ日数: ${activeDaysSet.size} 日`;
      document.getElementById('total-sets').textContent = `総セット数: ${totalSetsCount} セット`;

      const grid = document.getElementById('calendar-grid');
      const dows = grid.querySelectorAll('.calendar-dow');
      grid.innerHTML = '';
      dows.forEach(el => grid.appendChild(el));

      const firstDay = new Date(viewYear, viewMonth, 1).getDay();
      const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'calendar-day empty';
        grid.appendChild(empty);
      }

      for (let d = 1; d <= lastDate; d++) {
        const cell = document.createElement('div');
        cell.className = 'calendar-day';
        cell.textContent = d;
        const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        if (activeDaysSet.has(dateStr)) cell.classList.add('active');
        grid.appendChild(cell);
      }

      const historyArea = document.getElementById('history-area');
      const sorted = [...workouts].sort((a, b) => new Date(b.date) - new Date(a.date));

      if (sorted.length === 0) {
        historyArea.innerHTML = `<div class="empty-state">記録はまだありません。</div>`;
        return;
      }

      historyArea.innerHTML = sorted.map(w => {
        let contentHtml = '';
        if (w.isCardio) {
          const c = w.cardio || {};
          contentHtml = `<div class="history-set-item">時間: ${c.time || 0}分 / 速度: ${c.speed || '-'}km/h / 距離: ${c.distance || 0}km / カロリー: ${c.cal || 0}kcal</div>`;
        } else if (w.sets) {
          contentHtml = w.sets.map((s, i) => {
            const rm = s.weight > 0 && s.reps > 0 ? Math.round(s.weight * (1 + s.reps / 30)) : 0;
            return `<div class="history-set-item">${i + 1}セット: ${s.weight}kg × ${s.reps}回 ${rm > 0 ? `<span style="color:var(--text-sub);">(RM:${rm}kg)</span>` : ''}</div>`;
          }).join('');
        }

        return `
          <div class="history-card">
            <div class="history-top">
              <div>
                <span class="history-date">${w.date}</span>
                <span class="history-part">${w.part}</span>
              </div>
              <button class="delete-btn" onclick="deleteRecord(${w.id})">削除</button>
            </div>
            <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 6px;">${w.exercise}</div>
            ${contentHtml}
            ${w.memo ? `<div style="font-size:0.8rem; color:var(--text-sub); margin-top:8px;">メモ: ${w.memo}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    render();
  </script>
</body>
</html>
