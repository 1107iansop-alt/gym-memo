<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>筋トレMEMO</title>
  <style>
    :root {
      --bg-dark: #121214;
      --card-bg: #1c1c1e;
      --accent-red: #ff453a;
      --text-main: #ffffff;
      --text-sub: #8e8e93;
      --border-color: #2c2c2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px 16px 80px 16px;
      max-width: 500px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0 20px 0;
    }
    h1 { font-size: 1.5rem; color: var(--accent-red); font-weight: 700; }
    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }
    .summary-title { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px; }
    .summary-value { font-size: 2.2rem; font-weight: 800; }
    .summary-unit { font-size: 1rem; color: var(--text-sub); }
    .summary-stats { display: flex; gap: 20px; margin-top: 15px; font-size: 0.85rem; color: var(--text-sub); }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .btn {
      background-color: var(--accent-red);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-secondary { background-color: #2c2c2e; color: #0a84ff; }
    .history-head { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; }
    .empty-state {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      color: var(--text-sub);
      font-size: 0.9rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <h1>＜ 筋トレMEMO</h1>
    <span>⚙️</span>
  </header>

  <div class="card">
    <div class="summary-title" id="current-month">2026年11月 総括</div>
    <div class="summary-value">0.00 <span class="summary-unit">t</span></div>
    <div class="summary-stats">
      <span>トレ日数: 0 日</span>
      <span>総セット数: 0 セット</span>
    </div>
  </div>

  <div class="btn-grid">
    <button class="btn" onclick="alert('記録機能の準備中です')">＋ 今日のトレーニング追加</button>
    <button class="btn btn-secondary" onclick="alert('サマリー機能の準備中です')">📷 月間サマリー画像</button>
  </div>

  <div class="history-head">最近のトレーニング履歴</div>
  <div class="empty-state">
    記録はまだありません。「今日のトレーニング追加」から始めましょう。
  </div>
</body>
</html>
