<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Workout-Log</title>
  <!-- 画像ダウンロード・シェア用ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-dark: #121214;
      --card-bg: #1c1c1e;
      --accent-red: #ff453a;
      --text-main: #ffffff;
      --text-sub: #8e8e93;
      --border-color: #2c2c2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: max(16px, env(safe-area-inset-top) + 8px) 12px 65px 12px;
      max-width: 500px;
      margin: 0 auto;
      overflow-x: hidden;
    }
    header { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px 12px 4px; }
    h1 { font-size: 1.3rem; color: var(--accent-red); font-weight: 700; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background-color: var(--card-bg); border-radius: 16px; padding: 14px; margin-bottom: 16px; border: 1px solid var(--border-color); width: 100%; overflow: hidden; }
    
    /* ホーム上部：左右分割レイアウト（バランスよく高さを確保） */
    .home-top-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: center; }
    
    /* 左側：カレンダー */
    .calendar-container { display: flex; flex-direction: column; justify-content: center; }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
    .cal-btn { background: none; border: none; color: var(--accent-red); font-size: 1rem; cursor: pointer; padding: 2px 6px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; width: 100%; }
    .calendar-dow { color: var(--text-sub); padding-bottom: 3px; font-weight: 600; font-size: 0.65rem; }
    .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--text-main); background: #2c2c2e; font-size: 0.7rem; width: 100%; max-width: 28px; margin: 0 auto; cursor: pointer; }
    .calendar-day.active { background-color: var(--accent-red); font-weight: bold; }
    .calendar-day.selected { border: 2px solid #ffffff; }
    .calendar-day.empty { background: transparent; cursor: default; }

    /* 右側：上半（日数）＆下半（4行ボタン群） */
    .home-right-col { display: flex; flex-direction: column; gap: 8px; justify-content: space-between; height: 100%; }
    
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .stat-box { background: #121214; border: 1px solid var(--border-color); border-radius: 10px; padding: 6px 2px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
    .stat-title { font-size: 0.55rem; color: var(--text-sub); margin-bottom: 2px; white-space: nowrap; }
    .stat-val { font-size: 0.85rem; font-weight: 800; color: var(--accent-red); }

    /* 4行ボタン群 */
    .action-btn-list { display: flex; flex-direction: column; gap: 5px; }
    .mini-btn { background-color: var(--accent-red); color: white; border: none; border-radius: 8px; padding: 7px 6px; font-weight: bold; font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; width: 100%; }
    .mini-btn-secondary { background-color: #2c2c2e; color: var(--text-main); border: 1px solid var(--border-color); }

    .empty-state { background-color: var(--card-bg); border-radius: 12px; padding: 30px 20px; text-align: center; color: var(--text-sub); font-size: 0.9rem; margin-bottom: 16px; }

    /* メニュー表示カード */
    .workout-day-view { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 20px; border: 1px solid var(--border-color); }
    .workout-day-title { font-size: 1.05rem; font-weight: bold; color: var(--accent-red); margin-bottom: 14px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
    
    .history-card { background-color: #252528; border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border-color); cursor: pointer; transition: background 0.2s; }
    .history-card:hover { background-color: #2f2f33; }
    .history-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .history-part { background: #2c2c2e; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; color: var(--text-sub); }
    
    .history-set-row { display: grid; grid-template-columns: 20px 65px 10px 55px 1fr; align-items: center; font-size: 0.8rem; color: var(--text-main); margin-top: 4px; white-space: nowrap; }
    .set-num-col { text-align: right; padding-right: 4px; color: var(--text-main); }
    .set-weight-col { text-align: right; }
    .set-x-col { text-align: center; color: var(--text-sub); }
    .set-reps-col { text-align: right; padding-right: 4px; }
    .set-rm-col { display: flex; align-items: center; gap: 4px; font-size: 0.7rem; color: var(--text-sub); overflow: hidden; }

    .max-rm-badge { background-color: var(--accent-red); color: white; font-size: 0.55rem; font-weight: bold; padding: 1px 3px; border-radius: 3px; flex-shrink: 0; }

    .delete-btn { background: none; border: none; color: #ff453a; font-size: 0.75rem; cursor: pointer; padding: 4px; }
    .share-btn { width: 100%; background-color: var(--accent-red); color: white; border: none; border-radius: 14px; padding: 16px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-bottom: 20px; text-align: center; }

    /* フッターナビゲーション（下部隙間を完全に解消・最下部ピタッと固定） */
    .footer-nav {
      position: fixed; bottom: 0; left: 0; width: 100%; background: #1c1c1e; border-top: 1px solid var(--border-color);
      display: grid; grid-template-columns: repeat(2, 1fr); padding: 5px 0 0 0; height: 50px; z-index: 50;
    }
    .nav-item { background: none; border: none; color: var(--text-sub); display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; gap: 2px; cursor: pointer; padding-bottom: env(safe-area-inset-bottom, 0px); }
    .nav-item.active { color: var(--accent-red); }
    .nav-item span.icon { font-size: 1rem; }

    /* モーダル共通 */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: flex-end; z-index: 100; }
    .modal.open { display: flex; }
    .modal-content { background: var(--card-bg); width: 100%; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 20px 16px 40px 16px; border-top: 1px solid var(--border-color); }
    
    .modal-header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .exercise-title-header { font-size: 1.3rem; font-weight: bold; color: var(--accent-red); text-align: center; }
    
    .last-record-box { background: #2c2c2e; border-radius: 12px; padding: 12px; margin-bottom: 20px; font-size: 0.85rem; }
    .last-record-title { color: #0a84ff; font-weight: bold; margin-bottom: 6px; display: flex; justify-content: space-between; }

    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 0.80rem; color: var(--text-sub); margin-bottom: 6px; display: block; }
    .form-input, .form-select { width: 100%; background: #2c2c2e; border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 10px; font-size: 0.95rem; }

    .set-row { display: grid; grid-template-columns: 40px 1fr 1fr 60px; gap: 8px; align-items: center; margin-bottom: 10px; background: #252528; padding: 8px 10px; border-radius: 10px; }
    .set-num { font-weight: bold; color: var(--accent-red); text-align: center; font-size: 0.9rem; }
    .set-input { width: 100%; background: #1c1c1e; border: 1px solid var(--border-color); color: white; padding: 8px; border-radius: 8px; font-size: 0.95rem; text-align: center; }
    .set-rm { font-size: 0.75rem; color: var(--text-sub); text-align: center; }

    .add-set-btn { width: 100%; background: #2c2c2e; color: #34c759; border: 1px dashed #34c759; padding: 12px; border-radius: 10px; font-weight: bold; margin-top: 10px; cursor: pointer; }
    .submit-btn { width: 100%; background: var(--accent-red); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 1rem; margin-top: 20px; cursor: pointer; }
    .close-modal { width: 100%; background: #2c2c2e; color: var(--text-main); border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 0.95rem; margin-top: 8px; cursor: pointer; }
    .manage-btn { background: #2c2c2e; color: var(--text-main); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; }

    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .summary-box { background: #121214; border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; text-align: center; }
    .summary-box-title { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 4px; }
    .summary-box-val { font-size: 1.4rem; font-weight: 800; color: var(--accent-red); }
  </style>
</head>
<body>
  <header>
    <h1>Workout-Log</h1>
  </header>

  <!-- ホームタブ -->
  <div id="tab-home" class="tab-content active">
    <!-- ホーム上部：左右分割カード -->
    <div class="card">
      <div class="home-top-grid">
        <!-- 左側：カレンダー -->
        <div class="calendar-container">
          <div class="cal-header">
            <button class="cal-btn" onclick="changeMonth(-1)">◀</button>
            <span id="cal-title">2026年 11月</span>
            <button class="cal-btn" onclick="changeMonth(1)">▶</button>
          </div>
          <div class="calendar-grid" id="calendar-grid">
            <div class="calendar-dow">日</div><div class="calendar-dow">月</div><div class="calendar-dow">火</div>
            <div class="calendar-dow">水</div><div class="calendar-dow">木</div><div class="calendar-dow">金</div>
            <div class="calendar-dow">土</div>
          </div>
        </div>

        <!-- 右側：上半（日数）＆下半（4行ボタン群） -->
        <div class="home-right-col">
          <div class="stats-row">
            <div class="stat-box">
              <div class="stat-title">今月日数</div>
              <div class="stat-val" id="stat-month-days">0days</div>
            </div>
            <div class="stat-box">
              <div class="stat-title">合計日数</div>
              <div class="stat-val" id="stat-total-days">0days</div>
            </div>
          </div>

          <div class="action-btn-list">
            <button class="mini-btn" onclick="openModal()">今日のトレーニング追加</button>
            <button class="mini-btn mini-btn-secondary" onclick="openManageModal()">部位/種目の管理</button>
            <button class="mini-btn mini-btn-secondary" onclick="openSummaryModal()">月間サマリ</button>
            <button class="mini-btn mini-btn-secondary" onclick="shareCurrentDay()">シェア</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 選択した日付のメニュー表示エリア -->
    <div id="home-workout-display"></div>
  </div>

  <!-- 履歴 / 分析タブ -->
  <div id="tab-history" class="tab-content">
    <div class="filter-tabs" id="filter-tabs-container" style="display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:16px;"></div>
    <div class="card">
      <div class="cal-header">
        <button class="cal-btn" onclick="changeHistoryMonth(-1)">◀</button>
        <span id="history-cal-title">2026年 11月</span>
        <button class="cal-btn" onclick="changeHistoryMonth(1)">▶</button>
      </div>
      <div class="calendar-grid" id="history-calendar-grid">
        <div class="calendar-dow">日</div><div class="calendar-dow">月</div><div class="calendar-dow">火</div>
        <div class="calendar-dow">水</div><div class="calendar-dow">木</div><div class="calendar-dow">金</div>
        <div class="calendar-dow">土</div>
      </div>
    </div>
  </div>

  <!-- フッターナビゲーション -->
  <nav class="footer-nav">
    <button class="nav-item active" onclick="switchTab('home', this)">
      <span class="icon">🏠</span>
      <span>ホーム</span>
    </button>
    <button class="nav-item" onclick="switchTab('history', this)">
      <span class="icon">📅</span>
      <span>履歴/分析</span>
    </button>
  </nav>

  <!-- 記録入力モーダル -->
  <div class="modal" id="record-modal">
    <div class="modal-content">
      <div class="modal-header-nav">
        <div class="exercise-title-header" id="header-exercise-name">種目を選択してください</div>
      </div>

      <div class="form-group">
        <label class="form-label">日付</label>
        <input type="date" id="input-date" class="form-input">
      </div>

      <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="form-group">
          <label class="form-label">部位</label>
          <select id="input-part" class="form-select" onchange="onPartChange()"></select>
        </div>
        <div class="form-group">
          <label class="form-label">種目名</label>
          <select id="input-exercise-select" class="form-select" onchange="onExerciseChange()"></select>
        </div>
      </div>

      <div class="last-record-box" id="last-record-box">
        <div class="last-record-title">
          <span>Last Record</span>
          <span id="last-record-date">----/--/--</span>
        </div>
        <div id="last-record-content" style="color: var(--text-sub);">前回の記録はありません</div>
      </div>

      <div id="strength-input-area">
        <div style="display: grid; grid-template-columns: 40px 1fr 1fr 60px; gap: 8px; font-size: 0.75rem; color: var(--text-sub); text-align: center; margin-bottom: 6px;">
          <div>セット</div><div>重さ (kg)</div><div>回数 (reps)</div><div>推定1RM</div>
        </div>
        <div id="set-inputs-container"></div>
        <button class="add-set-btn" onclick="addSetInput()">＋ セットを追加</button>
      </div>

      <div id="cardio-input-area" style="display: none;">
        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label class="form-label">運動時間 (分)</label>
            <input type="number" id="cardio-time" class="form-input" placeholder="30">
          </div>
          <div class="form-group">
            <label class="form-label">速度 (km/h)</label>
            <input type="number" step="0.1" id="cardio-speed" class="form-input" placeholder="10.0">
          </div>
        </div>
        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label class="form-label">距離 (km)</label>
            <input type="number" step="0.01" id="cardio-distance" class="form-input" placeholder="5.0">
          </div>
          <div class="form-group">
            <label class="form-label">消費カロリー (kcal)</label>
            <input type="number" id="cardio-cal" class="form-input" placeholder="300">
          </div>
        </div>
      </div>

      <div class="form-group" style="margin-top: 15px;">
        <label class="form-label">メモ (任意)</label>
        <input type="text" id="input-memo" class="form-input" placeholder="フォームや感想など">
      </div>

      <button class="submit-btn" onclick="saveRecord()">記録を保存する</button>
      <button class="close-modal" onclick="closeModal()">キャンセル</button>
    </div>
  </div>

  <!-- 月間サマリモーダル -->
  <div class="modal" id="summary-modal">
    <div class="modal-content">
      <div id="summary-capture-target" style="padding: 10px; background: var(--card-bg); border-radius: 16px;">
        <div class="modal-header-nav">
          <div class="exercise-title-header" id="summary-modal-main-title">2026年 11月 サマリ</div>
        </div>
        
        <div class="card" style="margin-bottom: 16px;">
          <div class="cal-header">
            <button class="cal-btn" onclick="changeSummaryMonth(-1)">◀</button>
            <span id="summary-cal-title">2026年 11月</span>
            <button class="cal-btn" onclick="changeSummaryMonth(1)">▶</button>
          </div>
          <div class="calendar-grid" id="summary-calendar-grid">
            <div class="calendar-dow">日</div><div class="calendar-dow">月</div><div class="calendar-dow">火</div>
            <div class="calendar-dow">水</div><div class="calendar-dow">木</div><div class="calendar-dow">金</div>
            <div class="calendar-dow">土</div>
          </div>
        </div>

        <div class="summary-grid">
          <div class="summary-box">
            <div class="summary-box-title">合計筋トレ日数</div>
            <div class="summary-box-val" id="sum-days">0 days</div>
          </div>
          <div class="summary-box">
            <div class="summary-box-title">合計負荷量</div>
            <div class="summary-box-val" id="sum-ton">0.00 t</div>
          </div>
          <div class="summary-box">
            <div class="summary-box-title">合計セット数</div>
            <div class="summary-box-val" id="sum-sets">0 sets</div>
          </div>
          <div class="summary-box">
            <div class="summary-box-title">合計レップ数</div>
            <div class="summary-box-val" id="sum-reps">0 reps</div>
          </div>
        </div>

        <div id="summary-parts-breakdown" style="background: #121214; border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; margin-bottom: 10px;">
          <div style="font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; color: var(--accent-red);">■ 部位別集計</div>
          <div id="summary-parts-list" style="font-size: 0.85rem; color: var(--text-sub);">集計データはありません</div>
        </div>
      </div>

      <button class="download-action-btn" onclick="shareSummaryImage()" style="width:100%; background:#0a84ff; color:white; border:none; padding:14px; border-radius:12px; font-weight:bold; font-size:0.95rem; margin-top:15px; cursor:pointer;">サマリを画像保存</button>
      <button class="close-modal" onclick="closeSummaryModal()" style="margin-top:8px;">閉じる</button>
    </div>
  </div>

  <!-- 種目・部位管理モーダル -->
  <div class="modal" id="manage-modal">
    <div class="modal-content">
      <div class="exercise-title-header" style="margin-bottom: 15px;">種目・部位の管理</div>
      <div id="manage-content-area" style="font-size: 0.9rem; color: var(--text-main); margin-bottom: 20px;"></div>
      <button class="close-modal" onclick="closeManageModal()">閉じる</button>
    </div>
  </div>

  <script>
    let customParts = JSON.parse(localStorage.getItem('gym_custom_parts')) || ['胸', '背中', '脚', '肩', '腕', '腹', '前腕', 'お尻', '有酸素運動', 'その他'];
    let customExercises = JSON.parse(localStorage.getItem('gym_custom_exercises')) || {};
    let workouts = JSON.parse(localStorage.getItem('gym_workouts_v2')) || [];
    
    const todayStr = new Date().toISOString().split('T')[0];
    let selectedDate = todayStr;

    let viewYear = new Date().getFullYear();
    let viewMonth = new Date().getMonth();
    let historyViewYear = new Date().getFullYear();
    let historyViewMonth = new Date().getMonth();
    let summaryViewYear = new Date().getFullYear();
    let summaryViewMonth = new Date().getMonth();
    let currentSetCount = 0;
    let currentHistoryPart = 'ALL';

    function getAllParts() {
      return [...new Set(customParts)];
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

      document.getElementById(`tab-${tabId}`).classList.add('active');
      el.classList.add('active');

      if (tabId === 'history') {
        renderHistoryFilterTabs();
        renderHistoryCalendar();
      }
    }

    function openModal(targetPart = null, targetExercise = null, isEdit = false) {
      document.getElementById('input-date').value = selectedDate;
      document.getElementById('input-memo').value = '';
      document.getElementById('cardio-time').value = '';
      document.getElementById('cardio-speed').value = '';
      document.getElementById('cardio-distance').value = '';
      document.getElementById('cardio-cal').value = '';

      updatePartSelectOptions(targetPart, targetExercise);
      
      if (isEdit && targetPart && targetExercise) {
        const existing = workouts.find(w => w.date === selectedDate && w.part === targetPart && w.exercise === targetExercise);
        if (existing && existing.sets && existing.sets.length > 0) {
          const container = document.getElementById('set-inputs-container');
          container.innerHTML = '';
          currentSetCount = 0;
          existing.sets.forEach((s) => {
            currentSetCount++;
            const div = document.createElement('div');
            div.className = 'set-row';
            div.innerHTML =
